<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#1a2238"/>
      <stop offset="60%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#fde8a8" stop-opacity="1"/>
      <stop offset="55%" stop-color="#d4a849" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d4a849" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c14b"/>
      <stop offset="50%" stop-color="#d4a849"/>
      <stop offset="100%" stop-color="#8a6b1f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- faint outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#d4a849" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#d4a849" stroke-opacity="0.32" stroke-width="1"/>

  <!-- holocron diamonds (stacked, rotated 45deg) -->
  <g transform="rotate(45 256 256)">
    <rect x="106" y="106" width="300" height="300" rx="22" fill="none" stroke="url(#ring)" stroke-width="6" />
    <rect x="156" y="156" width="200" height="200" rx="18" fill="none" stroke="#d4a849" stroke-opacity="0.6" stroke-width="3" />
    <rect x="206" y="206" width="100" height="100" rx="10" fill="none" stroke="#fde8a8" stroke-opacity="0.85" stroke-width="2" />
  </g>

  <!-- glowing core -->
  <circle cx="256" cy="256" r="80" fill="url(#core)"/>
  <circle cx="256" cy="256" r="12" fill="#fde8a8"/>

  <!-- cardinal ticks -->
  <g stroke="#d4a849" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="40"  x2="256" y2="78"/>
    <line x1="256" y1="434" x2="256" y2="472"/>
    <line x1="40"  y1="256" x2="78"  y2="256"/>
    <line x1="434" y1="256" x2="472" y2="256"/>
  </g>
</svg>
